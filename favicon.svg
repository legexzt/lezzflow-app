<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#0a1228" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66a3ff" />
      <stop offset="50%" stop-color="#2f7bff" />
      <stop offset="100%" stop-color="#144ecc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#66a3ff" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#2f7bff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#66a3ff" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(102, 163, 255, 0.25)" stroke-width="2"/>
  
  <!-- Subtle inner radial glow -->
  <circle cx="64" cy="64" r="46" fill="#2f7bff" opacity="0.15" filter="url(#glow)"/>

  <!-- Orbit Ring behind 'L' -->
  <ellipse cx="64" cy="68" rx="46" ry="20" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" transform="rotate(-26 64 68)" stroke-dasharray="8 6" opacity="0.6"/>

  <!-- Stylized 3D Glowing 'L' -->
  <g filter="url(#intenseGlow)">
    <!-- 3D Shadow layer -->
    <path d="M42 34 L56 34 L56 78 L86 78 L86 92 L42 92 Z" fill="#0d2c6e" opacity="0.7" transform="translate(2, 3)"/>
    
    <!-- Main L lettermark -->
    <path d="M42 34 C42 31.79 43.79 30 46 30 L54 30 C56.21 30 58 31.79 58 34 L58 74 C58 75.1 58.9 76 60 76 L86 76 C88.21 76 90 77.79 90 80 L90 88 C90 90.21 88.21 92 86 92 L46 92 C43.79 92 42 90.21 42 88 Z" fill="url(#blueGrad)"/>

    <!-- Specular highlight facet on L -->
    <path d="M43 33 L57 33 L57 75 L43 75 Z" fill="url(#accentGrad)" opacity="0.35"/>
    <path d="M43 77 L87 77 L87 91 L43 91 Z" fill="url(#accentGrad)" opacity="0.25"/>
  </g>

  <!-- Orbit Ring in front with satellite node -->
  <g filter="url(#glow)">
    <path d="M22 79 C28 88 48 93 72 87 C96 81 108 67 106 58" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" transform="rotate(-26 64 68)"/>
    <!-- Orbit particle / node -->
    <circle cx="94" cy="50" r="4.5" fill="#ffffff"/>
    <circle cx="94" cy="50" r="8" fill="#38bdf8" opacity="0.6"/>
  </g>

  <!-- Accent dot for the trailing dot in 'lezzflow.' -->
  <circle cx="98" cy="88" r="4" fill="#38bdf8" filter="url(#glow)"/>
</svg>
